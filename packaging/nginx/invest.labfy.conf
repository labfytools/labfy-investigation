# CONTRACT: this server is included inside nginx's http block. Backend and
# public hostname stay on loopback; Host and Origin reach Labfy unchanged.
server {
    listen 127.0.0.1:80;
    server_name invest.labfy;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }
}
